name: deploy-phpmyadmin

on:
  push:
    branches:
      - main
    paths:
      - "**"
  workflow_dispatch:

env:

  REGION: ap-northeast-1
  ECS_CLUSTER: "ecs-cluster-yoshiike-0413"
  ECS_SERVICE: "phpmyadmin-service-yoshiike-0413"
  # IAMロールのARN（CloudFormationで作成したもの）
  AWS_ROLE_ARN: "arn:aws:iam::527151769671:role/GitHubActionsRole-yoshiike-0413"

jobs:

  deploy:

    runs-on: ubuntu-latest
    # 【必須】OIDC認証のための権限設定
    permissions:
      id-token: write
      contents: read

    steps:

    # --------------------------------------------------
    # ソースコード取得
    # --------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # --------------------------------------------------
    # AWS認証 (OIDC方式)
    # --------------------------------------------------
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.REGION }}
        role-to-assume: ${{ env.AWS_ROLE_ARN }}


    # --------------------------------------------------
    # Dockerイメージビルド
    #   phpMyAdminはDockerHubの公式イメージを利用するため
    #   Dockerイメージをビルドしない
    # --------------------------------------------------

    - name: Build Docker image
      run: |
        echo "Skip this Build part"

    # --------------------------------------------------
    # ECS Rolling Deployment
    # 既存のTaskDefinitionを再デプロイする
    # --------------------------------------------------
    - name: Start ECS Rolling Deployment
      run: |
        echo "Starting ECS Rolling Deployment..."

        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --force-new-deployment

        echo "Deployment request sent."

    # --------------------------------------------------
    # デプロイ完了待機
    # ECSサービスが安定するまで待つ
    # --------------------------------------------------
    - name: Wait for ECS service to stabilize
      run: |
        echo "Waiting for ECS service to stabilize..."

        aws ecs wait services-stable \
          --cluster $ECS_CLUSTER \
          --services $ECS_SERVICE

        echo "Deployment completed successfully!"
        